services:

  # === FastAPI application ===
  app:
    build: ./app
    restart: unless-stopped
    env_file: .env

    # --- Security hardening ---
    read_only: true                    # Immutable root filesystem
    cap_drop: [ALL]                    # Drop every Linux capability
    security_opt:
      - no-new-privileges:true         # Block privilege escalation
    user: "1000:1000"                  # Run as non-root (matches Dockerfile appuser)
    tmpfs:
      - /tmp                           # Writable temp dir (required for read_only)

    # --- Health probe used by nginx depends_on ---
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

    depends_on:
      db:
        condition: service_healthy     # Wait for PostgreSQL to be ready
    networks:
      - backend

  # === PostgreSQL database ===
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}

    # --- Security hardening ---
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add:                           # Postgres needs these for initialization
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_READ_SEARCH

    # --- Persistence + init scripts ---
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-scripts:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend

  # === Nginx reverse proxy ===
  nginx:
    build: ./nginx
    restart: unless-stopped
    ports:
      - "80:80"

    # --- Security hardening ---
    read_only: true
    cap_drop: [ALL]
    cap_add:
      - NET_BIND_SERVICE              # Needed to bind port 80
      - CHOWN                         # Nginx master chowns cache dirs to worker
      - SETUID                        # Master switches workers to nginx user
      - SETGID                        # Master switches workers to nginx group
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp                           # PID file (nginx.conf: pid /tmp/nginx.pid)
      - /var/cache/nginx               # Nginx cache dir
      - /var/run                        # Legacy PID/socket path

    depends_on:
      app:
        condition: service_healthy     # Start only when app is ready
    networks:
      - backend

# --- Isolated bridge network (containers not exposed to host network) ---
networks:
  backend:
    driver: bridge

# --- Named volume for database persistence across restarts ---
volumes:
  postgres_data:
