# --- Global settings ---
worker_processes auto;           # Match CPU cores automatically
error_log /var/log/nginx/error.log warn;
pid       /tmp/nginx.pid;        # Writable path for read-only root FS

events {
    worker_connections 1024;
}

http {
    # --- Security: hide Nginx version ---
    server_tokens off;

    # --- MIME types ---
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # --- Logging ---
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # --- Performance ---
    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;

    # --- Gzip: compress JSON responses ---
    gzip            on;
    gzip_types      application/json text/plain;
    gzip_min_length 256;

    # --- Upstream: FastAPI app ---
    upstream app_backend {
        server app:8000;
    }

    server {
        listen 8080;
        http2 on;
        server_name _;

        # --- Limit request body size (prevent large uploads) ---
        client_max_body_size 1m;

        # --- Security headers (separate file for clarity) ---
        include /etc/nginx/security_headers.conf;

        # --- Disable directory listing ---
        autoindex off;

        # --- Reverse proxy to FastAPI ---
        location / {
            proxy_pass http://app_backend;

            # Pass real client info to the app
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for upstream
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
            proxy_send_timeout    30s;
        }

        # --- Block access to hidden files (.env, .git, etc.) ---
        location ~ /\. {
            deny all;
            return 404;
        }
    }
}
