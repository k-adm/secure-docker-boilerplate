# --- Prevent MIME-type sniffing (e.g. script disguised as image) ---
add_header X-Content-Type-Options "nosniff" always;

# --- Block embedding in iframes (clickjacking protection) ---
add_header X-Frame-Options "DENY" always;

# --- Legacy XSS filter (still useful for older browsers) ---
add_header X-XSS-Protection "1; mode=block" always;

# --- Control how much referrer info is sent to other origins ---
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# --- Only allow resources from same origin by default ---
add_header Content-Security-Policy "default-src 'self'" always;

# --- Force HTTPS for 1 year (activate after enabling TLS) ---
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# --- Disable browser features the app doesn't need ---
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
